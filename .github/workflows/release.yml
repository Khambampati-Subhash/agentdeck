# A tag agentdeck-vX.Y.Z builds AgentDeck.app (ad hoc signed, macOS arm64)
# and opens a draft GitHub release with the zip and SHA256SUMS.
#
# Dry runs (a manual dispatch, or a PR touching the release files) build,
# zip, verify and upload the artifact, and never create a release.
name: release

on:
  push:
    tags: ['agentdeck-v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bundle-mac-app
      - scripts/release-check
      - VERSION
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR dry runs are cancelled; a tag build never is.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: 1.95.0
  ZIG_VERSION: 0.16.0

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # A tag push releases that tag; a dry run checks the one VERSION names.
      - name: Tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then tag="$REF_NAME"; else tag="agentdeck-v$(cat VERSION)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#agentdeck-v}" >> "$GITHUB_OUTPUT"
      - name: Release check
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/release-check "$TAG" --notes "$RUNNER_TEMP/notes.md"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # Clean release builds: no cache, so a release never reuses stale objects.
      - name: Build core
        working-directory: core
        run: cargo build --release --locked
      - name: Build app
        working-directory: app
        run: cargo build --release --locked
      - name: Bundle, zip and verify
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          out="$RUNNER_TEMP/out"
          dist="$RUNNER_TEMP/dist"
          zip="AgentDeck-$VERSION-macos-arm64.zip"
          mkdir -p "$out" "$dist"
          scripts/bundle-mac-app --app-bin app/target/release/agentdeck \
            --core-bin core/target/release/agentdeck-core --version "$VERSION" "$out"
          (cd "$out" && ditto -c -k --keepParent AgentDeck.app "$dist/$zip")
          check="$RUNNER_TEMP/check"
          rm -rf "$check" && mkdir -p "$check"
          ditto -x -k "$dist/$zip" "$check"
          codesign --verify --deep --strict --verbose=2 "$check/AgentDeck.app"
          (cd "$dist" && shasum -a 256 "$zip" > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AgentDeck-${{ steps.tag.outputs.version }}-macos-arm64
          path: |
            ${{ runner.temp }}/dist/AgentDeck-${{ steps.tag.outputs.version }}-macos-arm64.zip
            ${{ runner.temp }}/dist/SHA256SUMS
          if-no-files-found: error

  # Only a pushed agentdeck-v* tag gets here, and only this job can write.
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agentdeck-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AgentDeck-${{ needs.build.outputs.version }}-macos-arm64
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          scripts/release-check "$TAG" --notes "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "AgentDeck $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/AgentDeck-$VERSION-macos-arm64.zip" dist/SHA256SUMS
